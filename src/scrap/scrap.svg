<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Scrap">
  <title>Scrap — Signalcraft</title>
  <desc>Set data-power on the root svg to asleep, waking, low, steady or bright. Parts: #body #head #face-plate #eye #antenna #chest-light #arm-left #arm-right. Override the scrap color custom properties to re-tint.</desc>

  <g id="scrap">
    <g id="legs">
      <rect x="160" y="398" width="62" height="46" rx="4" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.16" stroke-width="3"></rect>
      <rect x="292" y="398" width="62" height="46" rx="4" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.16" stroke-width="3"></rect>
      <rect x="148" y="440" width="86" height="20" rx="6" fill="var(--scrap-rust, #A2603F)"></rect>
      <rect x="280" y="440" width="86" height="20" rx="6" fill="var(--scrap-rust, #A2603F)"></rect>
    </g>

    <g id="arm-left">
      <rect x="106" y="242" width="40" height="98" rx="6" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.16" stroke-width="3"></rect>
      <rect x="112" y="336" width="30" height="60" rx="5" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.12" stroke-width="3"></rect>
      <rect x="100" y="390" width="52" height="30" rx="8" fill="var(--scrap-rust, #A2603F)"></rect>
      <circle cx="126" cy="252" r="5" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.3"></circle>
    </g>

    <g id="arm-right">
      <rect x="366" y="242" width="40" height="88" rx="6" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.16" stroke-width="3"></rect>
      <rect x="370" y="326" width="30" height="66" rx="5" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.12" stroke-width="3"></rect>
      <rect x="360" y="386" width="52" height="30" rx="8" fill="var(--scrap-rust, #A2603F)"></rect>
      <circle cx="386" cy="252" r="5" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.3"></circle>
    </g>

    <g id="body">
      <rect x="150" y="222" width="212" height="182" rx="10" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.2" stroke-width="4"></rect>
      <rect x="160" y="300" width="92" height="70" rx="5" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-rust, #A2603F)" stroke-width="4"></rect>
      <rect x="172" y="316" width="30" height="8" rx="3" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.28"></rect>
      <rect x="172" y="334" width="52" height="8" rx="3" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.18"></rect>
      <rect class="accent" x="172" y="352" width="20" height="8" rx="3" fill="var(--scrap-accent, #5E7C6B)" opacity="0.5"></rect>
      <rect x="272" y="316" width="80" height="76" rx="5" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.14" stroke-width="3"></rect>
      <rect x="150" y="252" width="212" height="5" fill="var(--scrap-shade, #1B2027)" opacity="0.7"></rect>
      <circle cx="164" cy="236" r="6" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.32"></circle>
      <circle cx="348" cy="236" r="6" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.32"></circle>
      <circle cx="164" cy="390" r="6" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.22"></circle>
      <circle cx="348" cy="390" r="6" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.22"></circle>
      <rect x="228" y="196" width="56" height="34" rx="4" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.14" stroke-width="3"></rect>
    </g>

    <g id="chest-light">
      <circle cx="300" cy="268" r="30" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-rust, #A2603F)" stroke-width="4"></circle>
      <circle class="chest" cx="300" cy="268" r="19" fill="var(--scrap-light, #E8C87E)" opacity="0.85"></circle>
      <circle class="halo" cx="300" cy="268" r="27" fill="var(--scrap-light, #E8C87E)" opacity="0.12"></circle>
    </g>

    <g id="head">
      <g id="antenna">
        <rect x="198" y="20" width="9" height="70" rx="4" fill="var(--scrap-body, #2E3944)" transform="rotate(-22 202 90)"></rect>
        <circle cx="176" cy="26" r="13" fill="var(--scrap-rust, #A2603F)"></circle>
        <circle class="accent" cx="176" cy="26" r="6" fill="var(--scrap-light, #E8C87E)" opacity="0.5"></circle>
      </g>
      <rect x="154" y="80" width="204" height="124" rx="12" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.2" stroke-width="4"></rect>
      <rect x="336" y="112" width="26" height="52" rx="5" fill="var(--scrap-rust, #A2603F)"></rect>
      <g id="face-plate">
        <rect x="168" y="94" width="176" height="96" rx="8" fill="var(--scrap-shade, #1B2027)" stroke="var(--scrap-edge, #E6EDF2)" stroke-opacity="0.12" stroke-width="3"></rect>
        <circle cx="176" cy="90" r="5" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.3"></circle>
        <circle cx="338" cy="90" r="5" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.3"></circle>
        <rect x="270" y="164" width="58" height="10" rx="4" fill="var(--scrap-edge, #E6EDF2)" fill-opacity="0.16"></rect>
      </g>
      <g id="eye">
        <circle cx="220" cy="138" r="40" fill="var(--scrap-body, #2E3944)"></circle>
        <circle class="lit" cx="220" cy="138" r="33" fill="var(--scrap-light, #E8C87E)" opacity="1"></circle>
        <circle class="pupil" cx="220" cy="138" r="14" fill="var(--scrap-shade, #1B2027)" opacity="1"></circle>
        <circle cx="220" cy="138" r="40" fill="none" stroke="var(--scrap-rust, #A2603F)" stroke-width="5"></circle>
      </g>
      <g id="eye-small">
        <circle cx="304" cy="132" r="15" fill="var(--scrap-body, #2E3944)" stroke="var(--scrap-rust, #A2603F)" stroke-width="4"></circle>
        <circle class="lit-soft" cx="304" cy="132" r="8" fill="var(--scrap-light, #E8C87E)" opacity="0.8"></circle>
      </g>
    </g>
  </g>
</svg>
